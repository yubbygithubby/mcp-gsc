name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GSC_SKIP_OAUTH: "true"
      GSC_CONFIG_DIR: ${{ github.workspace }}/.test-config
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --frozen --group dev
      - run: uv run --frozen pytest -q
